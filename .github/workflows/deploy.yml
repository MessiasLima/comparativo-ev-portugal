name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      # Reads the Pages configuration without touching next.config.ts. Do not pass
      # `static_site_generator: next`: it writes a next.config.js that shadows our
      # next.config.ts and drops the Tailwind Turbopack loader, breaking @apply and
      # CSS package imports.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Next.js
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          # The custom domain serves the site from its root, so no base path is
          # applied. A repo-path deployment would need NEXT_PUBLIC_BASE_PATH.
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://comparativo-ev-portugal.appoutlet.dev

      - name: Type-check
        run: npx tsc --noEmit

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
